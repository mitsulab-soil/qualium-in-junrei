<style>
:root{--bg:#f6f4ee;--paper:#fffdf8;--ink:#23261f;--sub:#5d6157;--line:#d9d5c8;--accent:#2f7d6b;--aoi:#2e6f8e;--warn:#8a5a14;--chip:#ece8dc}

:root[data-theme="dark"]{--bg:#171a17;--paper:#1f231f;--ink:#e9e7df;--sub:#a8aa9f;--line:#3a3f37;--chip:#2a2f29;--aoi:#7cc0de;--warn:#e0b066}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:400;line-height:1.75;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
a{color:var(--aoi)}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:600;line-height:1.4;margin:0}
b,strong{font-weight:400}
#top{position:sticky;top:0;z-index:1100;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px 6px}
#top .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#top h1{font-size:15px;letter-spacing:.02em}
#top h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
#menuBtn{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;padding:2px 10px;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 12px;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#prog{margin-top:6px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#prog .p{font-variant-numeric:tabular-nums}
#prog .v{color:var(--sub);font-size:14px}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
#wrap{display:block}
#mapBox{position:relative;height:46vh;min-height:260px;isolation:isolate;z-index:0}   /* 11 人の検証 P2：Leaflet の部品を地図の箱の中に閉じ込める */
#map{position:absolute;inset:0;background:#dde3dc}
#aoi3d{position:absolute;right:8px;bottom:22px;width:92px;height:124px;z-index:600;border-radius:12px;background:rgba(255,253,248,.55);border:1px solid var(--line);overflow:hidden;cursor:pointer}
#aoi3d canvas{display:block;width:100%!important;height:100%!important}
#aoi3d .tag{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(255,253,248,.8);color:#23261f}
#aoi3d.off{width:auto;height:auto;padding:2px 8px}
#aoi3d.off canvas{display:none}
#aoi3d.off .tag{position:static;background:none}
#modeBar{position:absolute;right:8px;top:8px;z-index:600;display:flex;gap:4px}
#modeBar button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:14px}
#modeBar button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#walkInfo{position:absolute;left:8px;right:108px;bottom:22px;z-index:600;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.55;display:none}
body[data-mode=walk] #walkInfo{display:block}
#sheet{background:var(--paper);border-top:1px solid var(--line);padding:12px 16px 40px}
.bubble{position:relative;background:var(--chip);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14.5px}
.bubble .who button{float:right;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:13px;min-height:32px;margin:-4px -4px 0 8px;cursor:pointer}
.bubble .who{font-size:12px;color:var(--aoi);display:block;margin-bottom:2px}
.bubble .mk{font-size:11px;color:var(--sub);margin-left:6px}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.head h2{font-size:20px}
.head .no{font-size:14px;color:var(--sub)}
.meta{font-size:12.5px;color:var(--sub);margin:4px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.meta dt{white-space:nowrap}.meta dd{margin:0;overflow-wrap:anywhere}
.also{font-size:14px;background:var(--chip);border-radius:8px;padding:4px 10px;margin:4px 0 8px}
.steps{display:flex;gap:4px;margin:10px 0 6px}
.steps button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 2px;font-size:14px}
.steps button[aria-pressed=true]{background:var(--aoi);border-color:var(--aoi);color:#fff}
.layers{display:flex;gap:4px;margin:6px 0}
.layers button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:14px}
.layers button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.panel{font-size:15px;min-height:4.5em}
.panel p{margin:.3em 0}
.prep{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:8px;padding:2px 8px;display:inline-block;margin:4px 0}
.nazo{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.nazo .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nazo .opts button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:3px 10px;font-size:14px}
.nav{display:flex;gap:6px;margin:12px 0}
.nav button{flex:1;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 4px;font-size:14px}
.nav #here{background:var(--accent);color:#fff;border-color:var(--accent)}
.src{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.src a{overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--sub);border-left:3px solid var(--line);padding-left:8px;margin:8px 0}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer;font-size:14px}
details ul{padding-left:1.2em;margin:.4em 0;font-size:13.5px}
.list{font-size:14px;columns:2;column-gap:12px;padding:0;list-style:none}
.list li{break-inside:avoid;cursor:pointer;padding:1px 0}
.list li.v::before{content:"● ";color:var(--accent)}
.list li:not(.v)::before{content:"○ ";color:var(--sub)}
.list li.full::after{content:" ★";color:var(--warn);font-size:10px}
#safety{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#safety.on{display:flex}
#safety .box{background:var(--paper);border-radius:14px;padding:16px;max-width:420px;font-size:14px}
#safety button{margin-top:8px;width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px}
.num{background:var(--paper);border:2px solid var(--c,#2f7d6b);color:var(--ink);border-radius:999px;font-size:10.5px;line-height:18px;width:22px;height:22px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.num.v{background:var(--c,#2f7d6b);color:#fff}
.num.cur{transform:scale(1.35);z-index:999!important;outline:2px solid #e8b04a}
.me{width:14px;height:14px;border-radius:50%;background:#2a7de1;border:2px solid #fff;box-shadow:0 0 0 2px rgba(42,125,225,.35)}
.leaflet-container{font-family:inherit}
@media (min-width:900px){
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  #wrap{display:grid;grid-template-columns:1fr 440px;flex:1;min-height:0}
  #mapBox{height:100%}
  #sheet{border-top:0;border-left:1px solid var(--line);overflow-y:auto}
  #aoi3d{width:180px;height:250px}
  #walkInfo{right:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

てください。", "layers": {"nature": "観音堂の地面は標高 {elev} m。{rise}。公式は、一番からの巡礼道を「高篠山を登る」と書いています（一番から徒歩 45 分・2.1 km）。", "history": "公式の案内によると、万延元年（1860）の火事で焼ける前は、諸堂のある大きな伽藍だったといいます。いまの観音堂は明治 41 年（1908）の再建です。", "culture": "長享のころに水害を受けて、三十三か所から外されたものの、信者の強い望みで、まもなく三十四か所の札所になった――と公式は伝えています。秩父の札所が「三十四」である理由の一つとして語られている話です。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "nazo": {"q": "二番の御朱印は、どこでいただく？", "hint": "山の上のお堂に、納経所はありません。公式の案内を思い出して。", "options": ["山を下りた光明寺", "観音堂の中", "一番の四萬部寺"], "answer": 0, "why": "公式の案内は「御朱印は札所二番から山を下ったところにある光明寺でいただける」と書いています（受付の時間は公式の『よくある質問』に）。"}, "relook": "もう一度、来た道を。登ってきた高さを、足で思い出してみて。", "aoi_q": "33 から 34 へ。数が一つふえた話を、山の上で聞くと、どう聞こえますか。"}, "chichibu:3": {"src": ["https://chichibufudasho.com/fudasho/josenji/"], "aoi": "秩父三番、常泉寺。井戸の水の話が伝わるお寺です。", "look": "本堂の手前、左のほうにある井戸を探してください。", "layers": {"nature": "ここは標高 {elev} m。{rise}。公式は、民家のあいだを抜けると田がひらけ、その先に本堂が見える、と書いています。", "history": "本堂は弘化 4 年（1847）に焼け、安政 5 年（1858）に再建されたと公式は書いています。本堂の左手の観音堂は、明治 3 年（1870）に、秩父神社の境内にあった蔵福寺から薬師堂を移したものです。", "culture": "本堂の手前左に井戸があり、その水は「長命水」と呼ばれています。病に伏せった住職が、夢に現れた観音さまのお告げで泉の水を飲んで治った――と伝えられる話からです。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "nazo": {"q": "観音堂の軒の彫りものに、いるのはだれ？", "hint": "観音堂の軒の下、柱と柱をつなぐ、曲がった梁のあたりを見て。", "options": ["龍", "鶴", "獅子"], "answer": 0, "why": "公式の案内は、軒の海老虹梁（えびこうりょう）に龍の籠彫（かごぼり）が見られる、と書いています。"}, "relook": "観音堂を、もう一度見てください。この建物は、町の神社の境内から、ここへ移ってきました。", "aoi_q": "井戸の水は、この土地のどこから来ているのでしょう。"}, "chichibu:4": {"src": ["https://chichibufudasho.com/fudasho/kinshoji/"], "aoi": "秩父四番、金昌寺。石仏の多いお寺です。", "look": "仁王門をくぐる前に、立ち止まって門の両わきを見てください。", "layers": {"nature": "ここは標高 {elev} m。{rise}。", "history": "公式の案内によると、境内の石仏は、天明 3 年（1783）に始まる大飢饉などで亡くなった人の供養のために、古仙登嶽和尚が発願したもので、いまは 1300 余体（公式の見どころでは 1319 体）。かつては 3800 体ほどあったといわれます。", "culture": "本堂の回廊の右手に、子育て観音の像があります。寄進した吉野屋半左衛門が、子と妻をあいついで失ったあと、生前の母子の姿を浮世絵師に下絵をかかせて建てた像だと、公式は書いています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "nazo": {"q": "仁王門にかけられている、大きなものは？", "hint": "門をくぐる前に、立ち止まって門の両わきを見て。", "options": ["大わらじ", "大ちょうちん", "大しめなわ"], "answer": 0, "why": "公式の案内は「大わらじがかけられた仁王門」と書いています。"}, "relook": "石仏の列を、もう一度見てください。一体ずつ、寄進した人がいました。", "aoi_q": "1300 という数は、あなたの目には、どのくらいの広さに見えましたか。"}, "chichibu:5": {"src": ["https://chichibufudasho.com/fudasho/gokado/"], "aoi": "秩父五番、語歌堂。名前に、ことばの話が入っています。", "look": "来た道のほうへ数歩戻って、正面に見える山を見てください。", "layers": {"nature": "ここは標高 {elev} m。{rise}。公式は、ここへの道を「武甲山を正面に見ながら野良道を行く」と書いています。", "history": "このお堂は、長興寺の檀徒だった本間孫八が、慈覚大師の作と伝えられる観音像を安置するために建てた、と公式は書いています。御朱印は 250 m ほど離れた長興寺で。長享の番付では第 26 番「五閣堂」でした。", "culture": "観音堂で、旅の僧と孫八が和歌の奥義を語り合い、明け方に僧が消えた――孫八は僧を聖徳太子の化身と悟り、ここを語歌堂と名づけた、と伝えられています（公式は、救世観音ともいわれる、と書き添えています）。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "nazo": {"q": "四番からここへ来る道で、正面に見えていた山は？", "hint": "来た道のほうへ数歩戻って、まわりの山を見て。", "options": ["武甲山", "両神山", "城峯山"], "answer": 0, "why": "公式の案内は「武甲山を正面に見ながら野良道を行くと小さな仁王門に出会う」と書いています。"}, "relook": "仁王門の前で、もう一度、山のほうを見てください。和歌を語り合った夜明けにも、同じ山が見えていたのでしょうか。それは、わたしにも分かりません。", "aoi_q": "ことばを交わした場所が、名前になる。あなたなら、ここに何と名づけますか。"}, "chichibu:28": {"src": ["https://chichibufudasho.com/fudasho/hashidatedo/"], "aoi": "秩父二十八番、橋立堂。上を見てください。岩が近いです。", "look": "石段を上がったら、観音堂の後ろの岩壁を見上げてください。", "layers": {"nature": "ここは標高 {elev} m（{rise}）。公式は、観音堂に覆いかぶさるように迫る岩壁の高さを 65 m と書いています。お堂の横には橋立鍾乳洞があります。公式は、浦山口駅から「川の流れを聞きながら」歩く道だとも書いています。", "history": "観音堂は江戸中期の建築といわれ、堂内には鎌倉時代の作と伝えられる本尊・馬頭観世音が安置されている、と公式は書いています。長享の番付では第 8 番「橋立寺」でした。", "culture": "馬頭観世音を本尊とする札所は、日本百番観音の中で、西国二十九番の松尾寺とここだけ、と公式は書いています。馬が農作業や運輸の力だった時代には、縁日に飼い馬をひいて参る人で参道が賑わったといいます。鍾乳洞は、昔から胎内くぐりの霊場として巡礼に親しまれてきた、とも。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "note": "12 月の第二月曜日から 2 月末までは、納経（朱印）は二十七番 大渕寺で、と公式にあります。", "relook": "もう一度、岩壁を見上げてください。お堂は、岩の下に寄りそうように建っています。", "aoi_q": "岩と、お堂と、馬。この場所では、どれがいちばん古いのでしょう。"}, "chichibu:34": {"src": ["https://chichibufudasho.com/fudasho/suisenji/"], "aoi": "秩父三十四番、水潜寺。秩父の結び、そして百観音の結びと伝えられる寺です。", "look": "観音堂の前の、お砂踏みの場所を見てください。", "layers": {"nature": "ここは標高 {elev} m（{rise}。公式は、三十三番から徒歩 180 分・9 km と書いています）。観音堂の右の崖下に「水くぐりの岩屋」（いまは非公開）があり、中から清水が湧き出て「長命水」と呼ばれている、と公式は書いています。", "history": "西国・坂東・秩父の札所を合わせて百の観音にするために、秩父に一か寺を加え、水潜寺が日本百観音の結願寺になった――と伝承されている、と公式は書いています。長享の番付では第 33 番「水込」でした。", "culture": "観音堂の前には、百観音の宝前のお砂を納めたお砂踏みがあります。堂内の右手には、百観音の巡礼を終えた人たちの金剛杖や菅笠、千羽鶴が、満願の納札とともに納められている、と公式は書いています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、静かに、観音堂を見てください。納められたものの一つ一つが、だれかが歩き終えたしるしです。", "aoi_q": "三十四のうちの一つを終えた人と、百を終えた人。同じ場所に、違う道のりの足が立っています。"}, "bando:1": {"src": ["https://bandou.gr.jp/temple/81/", "https://sugimotodera.com/", "https://bandou.gr.jp/history/"], "aoi": "坂東一番、杉本寺。ここから、関東をめぐる長い輪がはじまります。", "look": "まず、本堂の屋根を見てください。", "layers": {"nature": "ここは標高 {elev} m。寺の公式サイトは、仁王門と本堂の屋根は茅葺きで、昔は 20 年もつといわれていたのが、近年の温暖化など気候の変化で、いまは 10 年もつかどうか、と書いています。", "history": "札所会の案内によると、開基は行基菩薩、創立は天平六年（734）と伝わり、「鎌倉最古の寺」と紹介されています。坂東の札所は鎌倉を出発地とし、ここが第一番です。", "culture": "札所会の歴史のページは、坂東の札所は西国に倣ってつくられ、頼朝の頃に気運が起こり実朝のときに定められたのではないか、という説を紹介しています。杉本寺の僧・浄台房が協力したと推考されている、とも。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、屋根を見てください。草の屋根は、葺き替える人がいて、はじめて続きます。", "aoi_q": "屋根の草のもちが、気候の変わり方を映している。土地の変化は、こんなところにも出るのですね。"}, "bando:12": {"src": ["https://bandou.gr.jp/temple/%e8%8f%af%e6%9e%97%e5%b1%b1-%e6%85%88%e6%81%a9%e5%af%ba%ef%bc%88%e6%85%88%e6%81%a9%e5%af%ba%e8%a6%b3%e9%9f%b3%ef%bc%89/"], "aoi": "坂東十二番、慈恩寺。さいたま市の岩槻区にあります。", "look": "境内に入る前に、まわりの土地の高さを、足と目で感じてみてください。", "layers": {"nature": "ここは標高 {elev} m（坂東の三十三の中では、{rank}）。地図の上で、川との位置を見てみてください。", "history": "札所会の案内によると、開基は慈覚大師、創立は天長元年（824）と伝わります。", "culture": "札所会の案内は、ここに玄奘塔（玄奘三蔵法師の霊骨を奉安）があると書き、年中行事に 2 月 5 日の玄奘忌、5 月 5 日の玄奘祭を挙げています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、境内を見わたしてください。遠い旅をした僧の名が、ここで記念されています。", "aoi_q": "長い旅をした人の名と、札所をめぐる旅。二つは、重なって見えますか。"}, "bando:13": {"same": "sensoji", "src": ["https://bandou.gr.jp/temple/%e9%87%91%e9%be%8d%e5%b1%b1-%e6%b5%85%e8%8d%89%e5%af%ba%ef%bc%88%e6%b5%85%e8%8d%89%e8%a6%b3%e9%9f%b3%ef%bc%89/", "https://www.senso-ji.jp/about/"], "aoi": "坂東十三番、浅草寺。江戸三十三観音の一番でもあります。坂東札所霊場会の事務所も、ここにあります。"}, "bando:19": {"src": ["https://bandou.gr.jp/temple/%e5%a4%a9%e9%96%8b%e5%b1%b1-%e5%a4%a7%e8%b0%b7%e5%af%ba%ef%bc%88%e5%a4%a7%e8%b0%b7%e8%a6%b3%e9%9f%b3%ef%bc%89/", "http://www.ooyaji.jp/"], "aoi": "坂東十九番、大谷寺。岩そのものに彫られた観音です。", "look": "お堂に入る前に、お堂がよりかかっている岩の色と肌を見てください。", "layers": {"nature": "ここは標高 {elev} m。寺の公式サイトは、このあたりの岩・大谷石を「緑色凝灰岩といい火山灰の堆積岩」と書いています。裏山の御止山（おとめやま）は、大谷石の奇岩群と赤松の景観で、平成 18 年（2006）に国の名勝に指定された、とも。", "history": "公式サイトによると、本尊の千手観音（高さ 4 m）は岩の面に直接彫られ、弘法大師の作と伝えられています。本尊をはじめ 10 躰の石仏は、昭和 29 年に国の特別史跡、昭和 36 年に重要文化財に指定されました。", "culture": "公式サイトに伝わる縁起では、ここは毒蛇の住む「地獄谷」と呼ばれ、弘法大師が毒蛇を退け、岩山に光る千手観音が彫られていた――とされます。池の弁財天に仕える白蛇は、その毒蛇が心を入れ替えた姿と伝えられています。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、岩を見てください。火山の灰が積もってできた石に、人が仏を彫りました。", "aoi_q": "灰が積もって石になる時間と、石に仏を彫る時間。二つの時間の長さは、ずいぶん違います。"}, "bando:21": {"src": ["https://bandou.gr.jp/temple/179/", "https://bandou.gr.jp/history/"], "aoi": "坂東二十一番、日輪寺。八溝山の上の札所です。", "look": "境内から、まわりの山並みを見てください。", "layers": {"nature": "ここは標高 {elev} m。坂東の三十三の中では、{rank}（地理院の標高から。位置は目安）。札所会の案内は「八溝山の原生林」「栃木の山並みが一望できる」と書き、1〜2 月は雪で登れない（御朱印は登山口の案内板に従う）としています。", "history": "札所会の案内によると、開基は役ノ行者、創立は天武天皇の朝（673）と伝わります。", "culture": "札所会の歴史のページは、天福二年（1234）に、僧の成弁が三十三か所を巡る途中、この八溝山観音堂に三百日こもり、観音像を彫ったという墨書銘（福島県の都々古別神社に残る）を、坂東の札所が巡られていた確かな史料として挙げています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、遠くの山並みを。790 年ほど前にも、ここまで登ってきた人がいました。", "aoi_q": "雪で道が閉じる季節がある札所。山が、人の通う時期を決めています。"}, "bando:31": {"src": ["https://bandou.gr.jp/temple/%e5%a4%a7%e6%82%b2%e5%b1%b1-%e7%ac%a0%e6%a3%ae%e5%af%ba%ef%bc%88%e7%ac%a0%e6%a3%ae%e8%a6%b3%e9%9f%b3%ef%bc%89/", "http://kasamori-ji.or.jp/"], "aoi": "坂東三十一番、笠森寺。岩の上に建つ観音堂です。", "look": "観音堂を下から見上げて、お堂を支える柱の組み方を見てください。", "layers": {"nature": "ここは標高 {elev} m。観音堂は、岩の上に柱を組んで建てる懸造りで、札所会の案内は「日本唯一の四方懸造り」と書いています。寺の公式サイトは、大雨で土砂災害の警戒が出た日に閉堂することを知らせています。", "history": "札所会の案内によると、開基は伝教大師、創立は延暦三年（784）と伝わり、観音堂は国の重要文化財です。", "culture": "札所会の案内は、近くの「熊野（ゆや）の清水」が全国名水百選であることも挙げています。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、柱を。柱の長さが、岩の形に合わせて違っているかどうか、目で確かめてみてください。", "aoi_q": "地面を平らにしないで、岩の形のまま建てる。土地に合わせる建て方です。"}, "bando:33": {"src": ["https://bandou.gr.jp/temple/%e8%a3%9c%e9%99%80%e6%b4%9b%e5%b1%b1-%e9%82%a3%e5%8f%a4%e5%af%ba%ef%bc%88%e9%82%a3%e5%8f%a4%e8%a6%b3%e9%9f%b3%ef%bc%89/", "https://www.nagoji.com/", "https://bandou.gr.jp/history/"], "aoi": "坂東三十三番、那古寺。坂東の打ち納めの寺です。", "look": "境内から、海（鏡ヶ浦）の方角を見てください。", "layers": {"nature": "ここは標高 {elev} m。札所会の案内は、観音堂からの「波静かな鏡ヶ浦の眺望」を挙げています。坂東の札所は、鎌倉から始まり、房総の海辺で結ばれます。", "history": "札所会の案内によると、開基は行基菩薩、創立は養老元年（717）と伝わります。観音堂は平成の大修理を終えています。札所会の歴史のページは、坂東の札所は安房の那古寺を打ち納めとする、と書いています。", "culture": "同じページは、坂東の札所は関東八か国に散らばり、全行程は三百三十里（約 1,300 km）で、巡るのは容易ではなかった、と書いています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、海を。ここまでの道のりは、地図の上でどう見えますか。", "aoi_q": "鎌倉から始まって、房総の海で終わる。坂東の輪は、関東をひとめぐりしています。"}, "edo:1": {"same": "sensoji", "src": ["https://www.senso-ji.jp/about/", "http://www.josenji.or.jp/kannon/"], "aoi": "江戸一番、浅草寺。坂東三十三観音の十三番でもあります。江戸の輪は、浅草から巡りはじめます。"}, "edo:6": {"src": ["http://www.josenji.or.jp/kannon/", "https://kaneiji.jp/information3.html"], "aoi": "江戸六番、清水観音堂。上野の山の、舞台のあるお堂です。", "look": "舞台の上から、下の方を見てください（参拝の人の妨げにならない所で）。", "layers": {"nature": "ここは標高 {elev} m（{rise}）。舞台から見下ろす先が、どのくらい低い土地か、目で確かめてみてください。", "history": "寛永寺の公式サイトによると、清水観音堂は寛永八年（1631）に天海大僧正が建立しました。", "culture": "同じページは、京都東山の清水寺を模した舞台造りのお堂で、本尊も清水寺から恵心僧都作の千手観音像を迎え、秘仏としてまつっている、と書いています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、舞台を。遠い京都のお堂の形が、江戸の山の上に写されました。", "aoi_q": "遠くの名所を、自分の町に写す。行けない人のための工夫だったのか、わたしには分かりません。"}, "edo:21": {"src": ["http://www.josenji.or.jp/kannon/", "https://www.zojoji.or.jp/info/history.html", "https://www.zojoji.or.jp/keidai/"], "aoi": "江戸二十一番、増上寺。札所の観音は、西向観音です。", "look": "三解脱門を、くぐる前に正面から見てください。", "layers": {"nature": "ここは標高 {elev} m。公式サイトは、西向観音はもと、観音山（いまの東京タワーのあたり）の辻堂に、鎌倉街道（いまの六本木方面）へ向けて置かれた石像だ、と伝えています。", "history": "公式サイトによると、増上寺は明徳四年（1393）に酉誉聖聰上人が開き、場所は武蔵国豊島郷貝塚（いまの千代田区平河町から麹町）と伝えられます。慶長三年（1598）にいまの芝へ移りました。三解脱門は元和八年（1622）の再建で、国の重要文化財です。", "culture": "西向観音は、昭和 50 年（1975）に安国殿の前へ遷され、昭和 55 年（1980）に観音堂が落成した、と公式サイトは書いています。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、門を。焼けずに残った門だと、公式サイトは書いています。", "aoi_q": "寺も、観音さまも、いまの場所へ移ってきた。動いてきた札所を、どう感じますか。"}, "edo:31": {"src": ["http://www.josenji.or.jp/kannon/", "https://honsenji.net/"], "aoi": "江戸三十一番、品川寺。旧東海道に面したお寺です。", "look": "門の前の道を見てください。東海道です。", "layers": {"nature": "ここは標高 {elev} m（{rise}）。地図で、海や川までの近さを見てみてください。", "history": "寺の公式サイトによると、品川寺は東海道に面し、平安時代前期に開創された、品川区でいちばん古い寺で、「品川」という地名の由来になった寺だといいます。", "culture": "同じサイトは、境内の江戸六地蔵の一つの地蔵菩薩は高さ 3 m 近くあり、大梵鐘は品川区とスイスのジュネーブ市の友好のきっかけになった、と書いています。"}, "marks": {"nature": "◐", "history": "◎", "culture": "◎"}, "relook": "もう一度、道を。街道を行き来した人が、この門の前を通りました。", "aoi_q": "街道の入り口の寺。旅に出る人は、ここで何を見たのでしょう。それは、わたしには分かりません。"}, "edo:33": {"src": ["http://www.josenji.or.jp/kannon/", "http://www.tendaitokyo.jp/jiinmei/6ryusenji/"], "aoi": "江戸三十三番、瀧泉寺（目黒不動尊）。江戸の輪の結びの札所です。", "look": "境内で、水の音がするほうを探してみてください。", "layers": {"nature": "ここは標高 {elev} m。天台宗東京教区の公式サイトは、慈覚大師が法具の獨鈷（とっこ）を投じると泉が湧き、「獨鈷の瀧」と名づけ、寺の名もこの霊泉にちなむ、と伝えています。", "history": "同じページは、大同三年（808）に慈覚大師が開いたと伝え、寛永年間に徳川家光の帰依を受けて堂塔が復興された、と書いています。境内からは縄文時代の土板が発掘された、とも。", "culture": "同じページは、ここを江戸三十三観音霊場の結願札所としています。本尊は目黒不動明王（秘仏・十二年に一度、酉年に開帳）で、札所の観音は聖観世音菩薩です（定泉寺の一覧）。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、水を。湧いた水が、寺の名になりました。", "aoi_q": "浅草の川から始まった江戸の輪が、目黒の湧き水で結ばれる。水で始まり、水で終わる道です。"}}, "shared": {"sensoji": {"look": "本堂の前に立ったら、隅田川の方角（東のほう）を確かめてみてください。", "layers": {"nature": "ここは標高 {elev} m。寺の公式サイトは、本尊は宮戸川（いまの隅田川）で漁をしていた兄弟の網にかかった、と伝えています。仁安 4 年（1169）の再建では、大雨の勢いで、山で伐った材木が次々と隅田河畔に流れ着いた、とも。", "history": "公式サイトによると、寺伝では、本尊が姿を現したのは推古天皇 36 年（628）3 月 18 日の早朝。天安元年（857）に慈覚大師円仁が来山し、御前立を謹刻したと伝わります。", "culture": "この寺は、坂東三十三観音の十三番であり、江戸三十三観音の一番でもあります。二つの輪が、ここで重なっています。"}, "marks": {"nature": "◎", "history": "◎", "culture": "◎"}, "relook": "もう一度、川の方角を見てください。この寺の話は、川から始まっています。", "aoi_q": "網にかかったのが魚でなかった朝のこと。川は、何を運んでくる場所だったのでしょう。"}}, "hyaku": {"t": "西国三十三所・坂東三十三所・秩父三十四所を合わせた 100 か所を、日本百観音といいます（坂東札所霊場会の公式サイト）。秩父の三十四番 水潜寺は、百観音の結願寺と伝えられています（秩父札所連合会の公式サイト）。", "src": ["https://bandou.gr.jp/", "https://chichibufudasho.com/fudasho/suisenji/"]}, "safety": ["歩きながら画面を見ないでください。見るときは、道の端で立ち止まって。", "山道では、足もと・天気・日の入りに気をつけて。秩父札所連合会は、歩き巡礼ではクマよけの鈴などで音を出すよう呼びかけています（公式「くまっぷ」）。", "坂東二十一番（八溝山）は、1〜2 月は雪で登れない、と札所会の案内にあります。季節と道の情報は、公式で確かめてください。"], "etiquette": ["境内では静かに。参拝している人の前に立たない・道をふさがない。", "参拝の作法は、それぞれの札所会・お寺の案内に従ってください（例：秩父の公式「参拝心得」）。このアプリは作法をつくりません。", "撮影・御朱印は、それぞれのお寺の掲示と決まりに従ってください。納経の時間は札所ごとに違います。"], "checked": "2026-10-03"};
const VOICE = {"chichibu_1_look": {"f": "web/voice/f0c2b5dc2290.m4a", "dur": 4.61, "pz": [[0.95, 1.26], [1.89, 2.29]], "t": "秩父一番、四萬部寺。ここから三十四の輪がはじまります。"}, "chichibu_1_nature": {"f": "web/voice/eebcdd7fe3e0.m4a", "dur": 7.07, "pz": [[2.68, 3.06], [4.88, 5.21]], "t": "ここの地面は標高 219 m。秩父の三十四の中では、高いほうから 26 番め。"}, "chichibu_1_history": {"f": "web/voice/faa3f59090cb.m4a", "dur": 11.07, "pz": [[1.52, 1.89], [4.02, 4.31], [6.77, 7.15], [8.89, 9.2]], "t": "公式の案内によると、本堂は元禄 10 年の建立で、埼玉県の指定有形文化財です。長享のころの番付では、ここは第 24 番でした。"}, "chichibu_1_relook": {"f": "web/voice/0434fcd0d894.m4a", "dur": 5.51, "pz": [[1.44, 1.74], [3.1, 3.43]], "t": "番号が入れかわっても、ここに来る人の足は、同じ坂を上ってきたのでしょうか。"}, "chichibu_2_look": {"f": "web/voice/ce89da22bd61.m4a", "dur": 4.0, "pz": [[0.83, 1.15], [1.85, 2.29]], "t": "秩父二番、真福寺。山の上の観音堂です。"}, "chichibu_2_nature": {"f": "web/voice/c14055d129b8.m4a", "dur": 6.07, "pz": [[3.19, 3.6]], "t": "観音堂の地面は標高 392 m。一番から 173 m 上る。"}, "chichibu_2_history": {"f": "web/voice/85c2847abd7f.m4a", "dur": 10.27, "pz": [[1.51, 1.91], [3.94, 4.21], [6.55, 7.02]], "t": "公式の案内によると、万延元年の火事で焼ける前は、諸堂のある大きな伽藍だったといいます。いまの観音堂は明治 41 年の再建です。"}, "chichibu_2_culture": {"f": "web/voice/9397f9e34099.m4a", "dur": 10.72, "pz": [[1.96, 2.23], [4.35, 4.64], [6.0, 6.35], [8.71, 9.1]], "t": "長享のころに水害を受けて、三十三か所から外されたものの、信者の強い望みで、まもなく三十四か所の札所になった――と公式は伝えています。"}, "chichibu_2_relook": {"f": "web/voice/d79ee00bfca4.m4a", "dur": 6.43, "pz": [[1.74, 2.02], [3.61, 3.89], [4.98, 5.36]], "t": "33 から 34 へ。数が一つふえた話を、山の上で聞くと、どう聞こえますか。"}, "chichibu_3_look": {"f": "web/voice/4e120f1cd9fa.m4a", "dur": 4.67, "pz": [[0.93, 1.25], [1.89, 2.32]], "t": "秩父三番、常泉寺。井戸の水の話が伝わるお寺です。"}, "chichibu_3_nature": {"f": "web/voice/0175a1552e30.m4a", "dur": 4.98, "pz": [[2.21, 2.63]], "t": "ここは標高 219 m。二番から 174 m 下る。"}, "chichibu_3_history": {"f": "web/voice/0f1660b9dfde.m4a", "dur": 5.24, "pz": [[1.75, 2.13]], "t": "本堂は弘化 4 年に焼け、安政 5 年に再建されたと公式は書いています。"}, "chichibu_3_culture": {"f": "web/voice/cb6eb61c13e4.m4a", "dur": 5.45, "pz": [[1.99, 2.3       cam.fov = big ? 24 : 18; cam.position.set(0, big ? 1.22 : 1.42, big ? 3.2 : 2.6); cam.lookAt(0, big ? 1.12 : 1.42, 0); cam.updateProjectionMatrix(); }
    size(); new ResizeObserver(size).observe(box);
    const clock = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick); if (hidden || document.hidden) return;
      const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime, br = RM ? 0 : Math.sin(t * 2 * Math.PI / 4.6);
      set("chest", -.012 * br, 0, 0); set("head", RM ? 0 : Math.sin(t * .7) * .03, RM ? 0 : Math.sin(t * .4) * .08, 0);
      let bv = 0; if (!RM) { const u = t % 4.3; bv = u < .09 ? u / .09 : u < .12 ? 1 : u < .26 ? 1 - (u - .12) / .14 : 0; }
      const em = v.expressionManager; em?.setValue("blink", bv); em?.setValue("aa", !RM && performance.now() < talkUntil ? .25 + .25 * Math.abs(Math.sin(t * 11)) : 0);
      v.update(dt); renderer.render(scene, cam);
    }
    tick(); aoiState = "ok";
  } catch (e) { aoiState = "fail"; box.querySelector(".tag").textContent = "碧（AI）"; console.warn("碧の姿を読めませんでした（言葉は吹き出しに出します）：", e?.message ?? e); }
}
if (!hidden) (window.requestIdleCallback || (f => setTimeout(f, 300)))(() => startAoi()); else aoiState = "idle";

// ---- はじめ
renderAll(); fitAll(); select(idx, true);
say(`わたしは碧（あおい）。AI の案内役です。坂東・秩父・江戸の三つの札所の輪を、一つの地図で案内します。お寺のことは公式の案内に書いてあることだけを話し、信じることについては決めつけません。上の「${C.map(c => c.short).join("・")}」で輪を切りかえられます。`);
$("sndBtn").onclick = e => { e.stopPropagation(); setSnd(!sndOn); }; setSnd(sndOn);
/* 声の書き出し用：札所ごとの、碧が話す文（鍵と文）。画面の操作には使わない */
window.__jrSays = () => { const out = []; for (const c of C) for (const s of c.stations) { const cd = cardOf(c, s);
  for (const st of ["look", "talk", "relook"]) for (const ly of st === "talk" ? ["nature", "history", "culture"].filter(k => cd.layers[k]) : [null]) out.push({ key: `${s.key.replace(":", "_")}_${st === "talk" ? ly : st}`, t: sayText(c, s, cd, st, ly) }); } return out; };
window.__fud = { SUBLOG, get VOICE() { return VOICE; }, select, setCirc, go, state: () => ({ circ, idx, step, layer, aoi: aoiState, key: cur().key, prog: $("progTxt").textContent, tiles: document.querySelectorAll(".leaflet-tile-loaded").length }) };
</script>
